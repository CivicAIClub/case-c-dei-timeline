name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build
        env:
          # Placeholders so the build has the variables it expects. Real
          # values live in Vercel project settings, never in this repo.
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
        run: npm run build
